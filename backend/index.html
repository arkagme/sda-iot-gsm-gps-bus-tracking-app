<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPS Tracker - Socket.IO Client</title>
    <style>
        /* Existing styles unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .connection-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .status-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.connected {
            background: #2ecc71;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        .data-display {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-row:last-child {
            border-bottom: none;
        }
        
        .data-label {
            font-weight: 600;
            color: #555;
        }
        
        .data-value {
            color: #667eea;
            font-family: 'Courier New', monospace;
        }
        
        .log-container {
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #3498db;
            padding-left: 10px;
        }
        
        .log-entry.success {
            border-left-color: #2ecc71;
        }
        
        .log-entry.error {
            border-left-color: #e74c3c;
        }
        
        .timestamp {
            color: #95a5a6;
            font-size: 11px;
        }
        
        .map-container {
            height: 400px;
            background: #ecf0f1;
            border-radius: 8px;
            /* Flexible container for map */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 14px;
        }
        /* Add style for the leaflet map */
        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
    </style>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
</head>
<body>
    <div class="container">
        <h1>🛰️ GPS Tracker Dashboard</h1>
        
        <div class="dashboard">
            <div class="card">
                <h2>Connection Settings</h2>
                <div class="connection-box">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText">Disconnected</span>
                </div>
                <input type="text" id="serverUrl" placeholder="Server URL (e.g., http://sda.arkagme.me)" value="http://sda.arkagme.me" />
                <input type="text" id="userId" placeholder="User ID (optional)" />
                <input type="text" id="routeId" placeholder="Route ID (optional)" />
                <input type="text" id="busId" placeholder="Bus ID (optional)" />
                <button id="connectBtn" onclick="toggleConnection()">Connect</button>
            </div>
            
            <div class="card">
                <h2>Current Location</h2>
                <div class="data-display" id="locationData">
                    <div class="data-row">
                        <span class="data-label">Latitude:</span>
                        <span class="data-value" id="latitude">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Longitude:</span>
                        <span class="data-value" id="longitude">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Bus ID:</span>
                        <span class="data-value" id="busIdDisplay">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Route ID:</span>
                        <span class="data-value" id="routeIdDisplay">--</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>GPS Status</h2>
                <div class="data-display">
                    <div class="data-row">
                        <span class="data-label">Last Update:</span>
                        <span class="data-value" id="lastUpdate">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Socket ID:</span>
                        <span class="data-value" id="socketId">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Connection Status:</span>
                        <span class="data-value" id="connectionStatus">--</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>Map View</h2>
            <div class="map-container">
                <!-- Leaflet map will appear here -->
                <div id="map"></div>
            </div>
        </div>
        
        <div class="card" style="margin-top: 20px;">
            <h2>Activity Log</h2>
            <div class="log-container" id="logContainer">
                <div class="log-entry">
                    <span class="timestamp">[System]</span> Ready to connect...
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        let socket = null;
        let isConnected = false;

        // Initialize Leaflet map with default view
        const map = L.map('map').setView([0, 0], 2);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marker for latest GPS location
        let marker = L.marker([0, 0]).addTo(map);

        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }
        
        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const userId = document.getElementById('userId').value;
            const routeId = document.getElementById('routeId').value;
            const busId = document.getElementById('busId').value;
            
            if (!serverUrl) {
                addLog('Please enter server URL', 'error');
                return;
            }
            
            addLog(`Connecting to ${serverUrl}...`);
            
            try {
                // Connect using Socket.IO
                socket = io(serverUrl, {
                    reconnection: true,
                    reconnectionDelay: 1000,
                    reconnectionDelayMax: 5000,
                    reconnectionAttempts: 5,
                    transports: ['websocket', 'polling'],
                    path: '/socket.io/'
                });
                
                socket.on('connect', () => {
                    isConnected = true;
                    updateConnectionStatus(true);
                    addLog('Connected successfully!', 'success');
                    
                    // Authenticate if userId provided
                    if (userId) {
                        socket.emit('authenticate', {
                            userId: userId,
                            routeId: routeId || null
                        });
                        addLog(`Authenticated as user: ${userId}`, 'success');
                    }
                    
                    // Subscribe to route if specified
                    if (routeId) {
                        socket.emit('subscribe_route', {
                            routeId: routeId
                        });
                        addLog(`Subscribed to route: ${routeId}`, 'success');
                    }
                    
                    // Subscribe to bus if specified
                    if (busId) {
                        socket.emit('subscribe_bus', {
                            busId: busId
                        });
                        addLog(`Subscribed to bus: ${busId}`, 'success');
                    }
                });
                
                socket.on('authenticated', (data) => {
                    addLog(`Authentication successful! Socket ID: ${data.socketId}`, 'success');
                    document.getElementById('socketId').textContent = data.socketId;
                });
                
                socket.on('subscribed', (data) => {
                    if (data.routeId) {
                        addLog(`Successfully subscribed to route: ${data.routeId}`, 'success');
                    }
                    if (data.busId) {
                        addLog(`Successfully subscribed to bus: ${data.busId}`, 'success');
                    }
                });
                
                socket.on('gps_update', (data) => {
                    handleGPSUpdate(data);
                });
                
                socket.on('error', (error) => {
                    addLog(`Socket error: ${error.message || error}`, 'error');
                });
                
                socket.on('connect_error', (error) => {
                    addLog(`Connection error: ${error.message || error}`, 'error');
                });
                
                socket.on('disconnect', () => {
                    isConnected = false;
                    updateConnectionStatus(false);
                    addLog('Disconnected from server');
                });
                
            } catch (error) {
                addLog(`Connection error: ${error.message}`, 'error');
            }
        }
        
        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                isConnected = false;
                updateConnectionStatus(false);
                addLog('Manually disconnected');
            }
        }
        
        function handleGPSUpdate(data) {
            addLog(`Received GPS update for bus: ${data.busId}`);
            
            if (data.data) {
                const gpsData = data.data;
                
                document.getElementById('latitude').textContent = gpsData.latitude.toFixed(6);
                document.getElementById('longitude').textContent = gpsData.longitude.toFixed(6);
                document.getElementById('busIdDisplay').textContent = data.busId || '--';
                document.getElementById('routeIdDisplay').textContent = data.routeId || '--';
                
                const timestamp = new Date().toLocaleTimeString();
                document.getElementById('lastUpdate').textContent = timestamp;
                
                addLog(`📍 Location updated: ${gpsData.latitude.toFixed(4)}, ${gpsData.longitude.toFixed(4)}`, 'success');
                
                // Update map view and marker position
                const latlng = [gpsData.latitude, gpsData.longitude];
                marker.setLatLng(latlng);
                marker.bindPopup(
                    `Bus: ${data.busId}<br>Route: ${data.routeId}<br>Lat: ${gpsData.latitude.toFixed(6)}<br>Lng: ${gpsData.longitude.toFixed(6)}`
                ).openPopup();
                map.setView(latlng, 16, {animate: true});
            }
        }
        
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const connectionStatus = document.getElementById('connectionStatus');
            
            if (connected) {
                indicator.classList.add('connected');
                statusText.textContent = 'Connected';
                connectBtn.textContent = 'Disconnect';
                connectionStatus.textContent = 'Connected';
            } else {
                indicator.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                connectBtn.textContent = 'Connect';
                connectionStatus.textContent = 'Disconnected';
            }
        }
        
        function addLog(message, type = '') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Keep only last 50 entries
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }
    </script>
</body>
</html>
